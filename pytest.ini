# pytest.ini
# markers:
#   spark —— 需要 JVM + pyspark 的测试（每个 module 启动一次 SparkSession，约 1-6 分钟）。
#            快速回归可用 `pytest -m "not spark"` 跳过；口径验收用
#            `python scripts/verify_spark_profile.py`（全量 1 万学生 100% 对比）。
[pytest]
markers =
    spark: Spark/JVM tests (slow, requires pyspark)
    interview: 模拟面试官引擎测试（离线，不依赖 MySQL/LLM）
